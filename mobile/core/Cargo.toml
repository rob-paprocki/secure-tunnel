[package]
name = "secure-tunnel-core"
version = "1.1.0"
edition = "2024"
description = "Tunnel core for the Secure Tunnel phone apps: the desktop app's WireGuard / AmneziaWG packet path behind a small C and JNI interface"
publish = false

[lib]
name = "securetunnel"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
boringtun = { version = "0.7.1", default-features = false }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
socket2 = { version = "0.6", features = ["all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes = "0.8"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(st_mobile)"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
